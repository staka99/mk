<header [class.scrolled]="isScrolled">
  <div class="header-inner">
    <a routerLink="/pocetna" class="brand" aria-label="Salon vjenčanica MK – početna" (click)="closeMenu()">
      <img src="assets/logo.png" alt="" class="brand-mark" />
      <span class="brand-word">Salon <em>vjenčanica</em> MK</span>
    </a>

    <nav class="nav-desktop">
      <a routerLink="/pocetna" routerLinkActive="active">Početna</a>
      <a routerLink="/o-nama" routerLinkActive="active">O nama</a>
      <a routerLink="/galerija" routerLinkActive="active">Galerija</a>
      <a routerLink="/kontakt" routerLinkActive="active">Lokacija</a>
      <a routerLink="/termin" routerLinkActive="active" class="nav-cta">Zakazivanje termina</a>
    </nav>

    <button class="menu-button" (click)="toggleMenu()" [class.open]="menuOpen" aria-label="Meni">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <div class="nav-mobile" [class.open]="menuOpen">
    <nav>
      <a routerLink="/pocetna" routerLinkActive="active" (click)="closeMenu()"><span class="nav-mobile-num">01</span>Početna</a>
      <a routerLink="/o-nama" routerLinkActive="active" (click)="closeMenu()"><span class="nav-mobile-num">02</span>O nama</a>
      <a routerLink="/galerija" routerLinkActive="active" (click)="closeMenu()"><span class="nav-mobile-num">03</span>Galerija</a>
      <a routerLink="/kontakt" routerLinkActive="active" (click)="closeMenu()"><span class="nav-mobile-num">04</span>Lokacija</a>
      <a routerLink="/termin" routerLinkActive="active" (click)="closeMenu()"><span class="nav-mobile-num">05</span>Zakazivanje termina</a>
    </nav>
    <div class="nav-mobile-footer">
      <a href="tel:+38765215007">+387 65 215 007</a>
      <div class="nav-mobile-socials">
        <a href="https://www.instagram.com/salonvjencanica.mk/" aria-label="Instagram" target="_blank"><mat-icon>photo_camera</mat-icon></a>
        <a href="https://www.facebook.com/salonvjencanicamk1" aria-label="Facebook" target="_blank"><mat-icon>facebook</mat-icon></a>
      </div>
    </div>
  </div>
</header>
